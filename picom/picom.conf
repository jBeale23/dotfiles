#################################
#             Shadows           #
#################################
shadow-radius = 1;
shadow-opacity = 0.6
shadow-offset-x = 0;
shadow-offset-y = 0;
shadow-color = "#000000"

#################################
#           Fading              #
#################################
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 3

#################################
#           Corners             #
#################################
corner-radius = 10

#################################
#            Blur               #
#################################
blur:
{
  method = "dual_kawase";
  size = 10;
  strength = 3;
};
blur-background = true
blur-background-fixed = true

#################################
#       General Settings        #
#################################
backend = "glx"
dithered-present = false;
vsync = true;
detect-rounded-corners = false;
detect-client-opacity = true;
use-ewmh-active-win = true;
detect-transient = true;
use-damage = true;
log-level = "warn";
log-file = "/home/jbeale/.local/state/picom/picom.log"

# See WINDOW RULES section in the man page for how these work.
rules: (
	{ match = "focused"; opacity = 1; },
	{ match = "focused"; match = "name = 'x-terminal-emulator'"; opacity = 0.85; },
	{ match = "!focused"; opacity = 0.85; },
	{ match = "fullscreen"; corner-radius = 0; },
	{ match = "class_g = 'i3bar'"; corner-radius = 0; },
	{ match = "tooltip"; fade = true; shadow = true; opacity = 0.5; focus = true; full-shadow = false; },
	{ match = "popup_menu"; opacity = 0.7; },
	{ match = "dropdown_menu"; opacity = 0.7; },
       )
